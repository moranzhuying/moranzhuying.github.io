<button class="scheme-toggle" id="scheme-toggle" title="切换明暗模式" aria-label="切换明暗模式"></button>
<script>
(function () {
  var KEY = 'next-scheme';
  var root = document.documentElement;
  var btn = document.getElementById('scheme-toggle');
  var mq = window.matchMedia('(prefers-color-scheme: dark)');

  function icon(s) {
    return s === 'dark' ? '\u2600' : '\u{1F319}';
  }

  function apply() {
    var s = null;
    try { s = localStorage.getItem(KEY); } catch (e) {}
    if (s === 'dark' || s === 'light') {
      root.style.colorScheme = s;
      btn.textContent = icon(s);
    } else {
      root.style.colorScheme = '';
      btn.textContent = mq.matches ? '\u2600' : '\u{1F319}';
    }
  }

  btn.addEventListener('click', function () {
    var cur = null;
    try { cur = localStorage.getItem(KEY); } catch (e) {}
    var next;
    if (cur === 'dark' || cur === 'light') {
      next = cur === 'dark' ? 'light' : 'dark';
    } else {
      next = mq.matches ? 'light' : 'dark';
    }
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply();
  });

  apply();
})();
</script>
